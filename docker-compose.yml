# GLaDOS Discord Bot — Docker Compose stack
#
# Services:
#   ollama       — local LLM inference (OpenAI-compatible API)
#   ollama-init  — one-shot model pull (runs after ollama is healthy)
#   voice        — GLaDOS TTS API (the prebuilt GLaDOS image, ghcr.io/herohade/glados)
#   whisper      — faster-whisper transcription service
#   bot          — Node.js Discord bot
#
# Images: bot and whisper are built by .github/workflows/docker-build.yml and pulled from GHCR (one whisper
# image per model: the tag is WHISPER_MODEL). If an image can't be pulled, Compose builds it from this repo;
# `--build` always builds locally.
#
# Usage:
#   cp .env.example .env   # fill in DISCORD_TOKEN
#   ./run.sh up            # auto-detects GPU vendor (AMD/NVIDIA/CPU)
#
# Or run with an explicit override:
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up --build
#
# ARM64 hosts (Apple Silicon, Raspberry Pi):
#   Images build natively. On x86-64 set:
#     DOCKER_DEFAULT_PLATFORM=linux/amd64 ./run.sh up --build
#
# Network: nothing is published on the host. Ollama, Whisper and the TTS API have no authentication, so they
# only talk to each other on the internal `backend` network. Ollama (model downloads) and the bot (Discord)
# also get `egress`; Whisper and the voice service have no internet access at all.

x-hardening: &hardening
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:

  ollama:
    <<: *hardening
    container_name: ollama
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  ollama-init:
    <<: *hardening
    container_name: ollama_init
    image: curlimages/curl:8.23.0
    restart: "no"
    command:
      - "-sf"
      - "http://ollama:11434/api/pull"
      - "-H"
      - "Content-Type: application/json"
      - "-d"
      - "{\"name\":\"${OLLAMA_MODEL:-qwen2.5:3b-instruct}\"}"
    networks: [backend]
    depends_on:
      ollama:
        condition: service_healthy

  # The GLaDOS image's default command is its TTS API on :5050 (models included in the image).
  voice:
    <<: *hardening
    container_name: glados_voice
    image: ${VOICE_IMAGE:-ghcr.io/herohade/glados:latest}
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:5050/v1/audio/speech', data=b'{\"input\":\"test\",\"voice\":\"glados\"}', headers={'Content-Type': 'application/json'}), timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # faster-whisper runs as a persistent service so the model stays loaded
  # between requests instead of reloading on every transcription.
  whisper:
    <<: *hardening
    container_name: whisper
    image: ghcr.io/${IMAGE_OWNER:-herohade}/dlados-whisper:${WHISPER_MODEL:-base}
    build:
      context: .
      dockerfile: Dockerfile.whisper
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  bot:
    <<: *hardening
    container_name: glados_bot
    image: ghcr.io/${IMAGE_OWNER:-herohade}/dlados-bot:latest
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_ENDPOINT=http://ollama:11434/v1/chat/completions
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      - TTS_ENDPOINT=http://voice:5050/v1/audio/speech
      - WHISPER_ENDPOINT=http://whisper:9000/v1/audio/transcriptions
    volumes:
      - bot_logs:/app/logs
    networks: [backend, egress]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      voice:
        condition: service_healthy
      whisper:
        condition: service_healthy

networks:
  backend:
    internal: true
  egress: {}

volumes:
  ollama_data:
  bot_logs:
